<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Vibes - המדריך הניו-יורקי שלך</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        header {
            margin-bottom: 30px;
        }
        h1 {
            color: #f39c12;
            font-size: 2.5em;
        }
        .vibe-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            background-color: #1fe064;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #17b950;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .music-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        .song-list {
            list-style: none;
            padding: 0;
            text-align: right;
        }
        .song-item {
            background: #2a2a2a;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .genre-badge {
            background-color: #333;
            color: #1fe064;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <header>
        <h1>🗽 NYC VIBES</h1>
        <p>בחר את האווירה שלך וקבל מסלול יומי + פלייליסט אורבני מותאם</p>
    </header>

    <div class="vibe-buttons">
        <button onclick="selectVibe('morning')">☕ בוקר רגוע & קפה (SoHo)</button>
        <button onclick="selectVibe('museum')">🎨 אמנות & פארק (Upper West Side)</button>
        <button onclick="selectVibe('hipster')">📸 וינטג' & אוכל רחוב (Williamsburg)</button>
        <button onclick="selectVibe('night')">🍸 ברים & לילה אורבני (East Village)</button>
    </div>

    <div class="container">
        <h2 id="vibe-title">בחר וויב כדי להתחיל!</h2>
        <p id="vibe-description">המסלול וההמלצות שלך יופיעו כאן...</p>

        <div class="music-section">
            <h3>🎧 פלייליסט אורבני לוויב</h3>
            <div class="song-list" id="song-list">
                <div class="song-item">בחר וויב למעלה כדי לראות את השירים המתאימים...</div>
            </div>
        </div>
    </div>

    <script>
        function selectVibe(type) {
            const title = document.getElementById('vibe-title');
            const desc = document.getElementById('vibe-description');
            const songList = document.getElementById('song-list');

            if (type === 'morning') {
                title.innerText = "☕ בוקר בסוהו וצ'לסי";
                desc.innerText = "תחילת יום רגועה: קפה איכותי ב-La Colombe, טיול בגלריות של צ'לסי והליכה על ההיי-ליין (High Line).";
                songList.innerHTML = `
                    <div class="song-item"><span>Taylor Swift - Welcome To New York</span> <span class="genre-badge">פופ בוקר ☀️</span></div>
                    <div class="song-item"><span>Lou Reed - Walk on the Wild Side</span> <span class="genre-badge">קלאסיקת של פעם 🎸</span></div>
                    <div class="song-item"><span>Suzanne Vega - Tom's Diner</span> <span class="genre-badge">אורבני מלטף ☕</span></div>
                `;
            } else if (type === 'night') {
                title.innerText = "🍸 לילה באיסט וילג'";
                desc.innerText = "ברים סודיים (Speakeasy), אווירה אורבנית תוססת ופיצה פתוחה ב-2 בלילה.";
                songList.innerHTML = `
                    <div class="song-item"><span>Jay-Z ft. Alicia Keys - Empire State of Mind</span> <span class="genre-badge">היפ הופ / פופ 🏙️</span></div>
                    <div class="song-item"><span>Nas - N.Y. State of Mind</span> <span class="genre-badge">היפ הופ קלאסי 🎤</span></div>
                    <div class="song-item"><span>The Notorious B.I.G. - Juiciness / Hypnotize</span> <span class="genre-badge">קלאסיקת היפ הופ 👟</span></div>
                `;
            } else if (type === 'hipster') {
                title.innerText = "📸 וינטג' ואוכל ברוקלין";
                desc.innerText = "חנויות יד שנייה, שוק האוכל Smorgasburg ותצפית מדהימה על מנהטן מגרנד פיירי פארק.";
                songList.innerHTML = `
                    <div class="song-item"><span>Beastie Boys - No Sleep Till Brooklyn</span> <span class="genre-badge">היפ הופ / רוק 👟</span></div>
                    <div class="song-item"><span>The Strokes - Last Nite</span> <span class="genre-badge">אינדי ניו יורקי 🎸</span></div>
                    <div class="song-item"><span>A$AP Rocky - L$D</span> <span class="genre-badge">היפ הופ מודרני 🎧</span></div>
                `;
            } else if (type === 'museum') {
                title.innerText = "🎨 תרבות וסנטרל פארק";
                desc.innerText = "מוזיאון ה-Natural History, טיול באגם בסנטרל פארק ובייגל מסורתי ב-Zabar's.";
                songList.innerHTML = `
                    <div class="song-item"><span>Stevie Wonder - Living for the City</span> <span class="genre-badge">סול של פעם 🎹</span></div>
                    <div class="song-item"><span>Hall & Oates - Maneater</span> <span class="genre-badge">פופ 80s קלאסי 🕺</span></div>
                    <div class="song-item"><span>Bleachers - Chinatown</span> <span class="genre-badge">פופ-רוק אורבני 🗽</span></div>
                `;
            }
        }
    </script>
</body>
</html>
